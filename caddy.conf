# Cranium Charades - Path-based (legacy)
redir /cranium-charades /cranium-charades/ 301

handle /cranium-charades/* {
    uri strip_prefix /cranium-charades
    reverse_proxy localhost:8004
}

# Cranium Charades - Subdomain-based (new)
cranium-charades.doughughes.net {
    reverse_proxy localhost:8004
}
